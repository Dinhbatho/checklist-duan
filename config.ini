[quet]
; Thu muc goc can quet. Dung dau nhay -> khong can escape dau \
folder_goc = L:\05-Du an dau tu\215DT-Yen Binh

; Thu muc chua file ket qua (tuong doi so voi thu muc chua quet.py)
thu_muc_ra = ketqua

; Cac duoi file can thong ke, ngan cach bang dau phay
duoi_file = pdf, xls, xlsx, xlsm, doc, docx, jpg, png, dwg, ppt, pptx

; Cac thu muc he thong bo qua
loai_tru = $RECYCLE.BIN, System Volume Information, $SysReset, Recovery

; Do sau toi da (chong junction lap vo tan)
do_sau_toi_da = 120

; Bo qua folder an / he thong (1 = co, 0 = khong)
bo_qua_an = 1

; To mau tung cap duong dan trong cot B (1 = co, 0 = khong -> chay nhanh hon)
to_mau_duong_dan = 1
